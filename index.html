const hint=(k,y)=>{ctx.fillStyle='#b4cdbc';ctx.font=`700 ${13*u}px Cairo,sans-serif`;ctx.textAlign='center';ctx.fillText(T(k),W/2,y)};
function genP(n){const c=Array(n*n).fill(0),v=Array(n*n).fill(0),src=(n>>1)*n+(n>>1),L=[src];v[src]=1;
while(L.length){const k=Math.random()*L.length|0,i=L[k],x=i%n,y=i/n|0,o=[];
BV.forEach(([dx,dy,b])=>{const X=x+dx,Y=y+dy;if(X>=0&&X<n&&Y>=0&&Y<n&&!v[Y*n+X])o.push([Y*n+X,b])});
if(!o.length){L.splice(k,1);continue}
const [j,b]=o[Math.random()*o.length|0];c[i]|=b;c[j]|=((b<<2)|(b>>2))&15;v[j]=1;L.push(j)}
return{c,src}}
function pCalc(){const n=pN,v=Array(n*n).fill(0),q=[pSrc];v[pSrc]=1;let c=0;
while(q.length){const i=q.pop();c++;const m=rotm(pB[i],pR[i]),x=i%n,y=i/n|0;
BV.forEach(([dx,dy,b])=>{if(!(m&b))return;const X=x+dx,Y=y+dy;if(X<0||X>=n||Y<0||Y>=n)return;const j=Y*n+X;if(v[j])return;if(rotm(pB[j],pR[j])&(((b<<2)|(b>>2))&15)){v[j]=1;q.push(j)}})}
pWet=v;return c}
function pNew(){const n=PS[pLv];pN=n;const g=genP(n);pB=g.c;pSrc=g.src;do{pR=pB.map(()=>Math.random()*4|0)}while(pCalc()===n*n);pA=pR.map(r=>r*1.5708);pLock=0;pT=0}
function pStart(){cur=3;$('hud').classList.remove('nw');pLv=0;pTot=0;score=0;yr=0;won=0;parts=[];st='play';show('');$('hud').classList.remove('hide');$('wi').style.width='100%';$('wbar').classList.remove('low');pNew();hud()}
function updP(dt){t+=dt;pTot+=dt;pT+=dt;pA=pA.map((a,i)=>a+(pR[i]*1.5708-a)*Math.min(1,dt*16));partsUp(dt);$('wi').style.width=Math.max(0,100-pTot/4.8)+'%';if(pTot>=480)finish(0)}
const pGeo=()=>{const bs=Math.min(W-28*u,H*.56);return{bs,x0:(W-bs)/2,y0:(H-bs)/2+34*u,c:bs/pN}};
function tapP(x,y){if(pLock)return;const n=pN,{x0,y0,c}=pGeo(),col=Math.floor((x-x0)/c),row=Math.floor((y-y0)/c);if(col<0||col>=n||row<0||row>=n)return;
pR[row*n+col]++;beep(300+Math.random()*80,.05,'triangle');
if(pCalc()===n*n){pLock=1;score+=100+Math.max(0,80-pT|0)*2;yr=++pLv;hud();banner();burst(W/2,H/2,'#5ac8fa',30);burst(W/2,H/2,'#e6c36a',20);beep(880,.25,'triangle');
if(pLv>=10)setTimeout(()=>finish(1),1100);else setTimeout(pNew,1000)}}
function drawP(){ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b3a4a');g.addColorStop(1,'#04141c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(120,220,255,.25)';for(const p of mot){p.y-=p.v*.004;if(p.y<0)p.y=1;ctx.beginPath();ctx.arc(p.x*W+Math.sin(t+p.x*9)*8,p.y*H,p.r*u*1.4,0,7);ctx.fill()}
const n=pN,{bs,x0,y0,c}=pGeo();pCalc();
ctx.fillStyle='rgba(0,0,0,.35)';rr(x0-8*u,y0-8*u,bs+16*u,bs+16*u,18*u);ctx.fill();
for(let i=0;i<n*n;i++){const x=x0+(i%n)*c,y=y0+(i/n|0)*c,cx=x+c/2,cy=y+c/2,w=pWet[i];
ctx.fillStyle='rgba(255,255,255,.06)';rr(x+3*u,y+3*u,c-6*u,c-6*u,10*u);ctx.fill();
ctx.save();ctx.translate(cx,cy);ctx.rotate(pA[i]);ctx.lineWidth=c*.2;ctx.strokeStyle=w?'#5ac8fa':'#7a6a58';ctx.lineCap='butt';if(w){ctx.shadowColor='#5ac8fa';ctx.shadowBlur=10*u}
BV.forEach(([dx,dy,b])=>{if(pB[i]&b){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(dx*c/2,dy*c/2);ctx.stroke()}});
ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(0,0,c*.1,0,7);ctx.fill();ctx.restore();
const m=pB[i];
if(i===pSrc){ctx.fillStyle='#2fa8ff';ctx.shadowColor='#5ac8fa';ctx.shadowBlur=14*u;ctx.beginPath();ctx.arc(cx,cy,c*.2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx,cy-c*.12);ctx.quadraticCurveTo(cx+c*.1,cy+c*.02,cx,cy+c*.1);ctx.quadraticCurveTo(cx-c*.1,cy+c*.02,cx,cy-c*.12);ctx.fill()}
else if(m===1||m===2||m===4||m===8){ctx.globalAlpha=w?1:.6;plantIcon(ctx,cx,cy-c*.05,c*.72,w?6:1,t);ctx.globalAlpha=1}}
if(pT>35&&!pLock){const w=pB.findIndex((m,i)=>rotm(m,pR[i])!==m);if(w>=0){const x=x0+(w%n)*c,y=y0+(w/n|0)*c;ctx.strokeStyle='#ffd54a';ctx.globalAlpha=.5+.5*Math.sin(t*6);ctx.lineWidth=3*u;rr(x+3*u,y+3*u,c-6*u,c-6*u,10*u);ctx.stroke();ctx.globalAlpha=1}}partsDraw();hint('h3',y0+bs+34*u)}
const HG=()=>{const cw=Math.min(W-28*u,H*.6*3/4),c=cw/3;return{c,x0:(W-cw)/2,y0:(H-c*4)/2+34*u}};
function hStart(){cur=4;$('hud').classList.remove('nw');score=0;yr=0;won=0;parts=[];hP=Array(12).fill(0).map(()=>({s:0,t:0,d:0}));hT=0;hSp=.4;hCo=0;st='play';show('');$('hud').classList.remove('hide');$('wi').style.width='100%';$('wbar').classList.remove('low');hud()}
function updH(dt){t+=dt;hT+=dt;const ny=Math.min(10,hT/5|0);if(ny>yr){yr=ny;hud();beep(880,.15,'triangle')}
hSp-=dt;if(hSp<=0){hSp=Math.max(.32,.95-yr*.06);const e=[];hP.forEach((p,i)=>{if(!p.s)e.push(i)});if(e.length){const p=hP[e[Math.random()*e.length|0]],w=Math.random()<.12+yr*.012;p.s=w?4:1;p.t=0;p.d=w?Math.max(.9,1.5-yr*.05):.55+Math.random()*.3}}
hP.forEach(p=>{if(!p.s)return;p.t+=dt;if(p.t>=p.d){if(p.s===1){p.s=2;p.t=0;p.d=Math.max(.7,1.6-yr*.09)}else if(p.s===2){p.s=3;p.t=0;p.d=.6;hCo=0}else p.s=0}});
partsUp(dt);$('wi').style.width=Math.max(0,100-hT*2)+'%';$('wbar').classList.toggle('low',hT>42);if(hT>=50)finish(1)}
function tapH(x,y){const{c,x0,y0}=HG(),col=Math.floor((x-x0)/c),row=Math.floor((y-y0)/c);if(col<0||col>2||row<0||row>3)return;const p=hP[row*3+col],cx=x0+(col+.5)*c,cy=y0+(row+.5)*c;
if(p.s===2){hCo++;score+=10+Math.min(hCo,10)*2;burst(cx,cy,'#ffd54a',14);beep(520+Math.min(hCo,10)*50,.09,'triangle');p.s=0;hud()}
else if(p.s===1||p.s===4){hCo=0;score=Math.max(0,score-5);hT+=p.s===4?3:1.5;shake=.3;burst(cx,cy,p.s===4?'#a05ae0':'#8a6a4a',10);beep(110,.15,'sawtooth',.08);navigator.vibrate&&navigator.vibrate(40);p.s=0;hud()}
else if(p.s===3){hCo=0;p.s=0}}
function drawH(){ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3d2d14');g.addColorStop(1,'#120b04');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='rgba(255,224,140,.25)';for(const p of mot){p.y-=p.v*.004;if(p.y<0)p.y=1;ctx.beginPath();ctx.arc(p.x*W+Math.sin(t+p.x*9)*8,p.y*H,p.r*u,0,7);ctx.fill()}
const{c,x0,y0}=HG();ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*8*u,(Math.random()-.5)*8*u);
for(let i=0;i<12;i++){const p=hP[i],cx=x0+(i%3+.5)*c,cy=y0+((i/3|0)+.5)*c;
ctx.fillStyle='rgba(70,44,22,.85)';rr(cx-c*.46,cy-c*.46,c*.92,c*.92,14*u);ctx.fill();ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(cx,cy+c*.28,c*.3,c*.08,0,0,7);ctx.fill();
if(p.s===1){const k=Math.min(1,p.t/p.d);plantIcon(ctx,cx,cy-c*.03,c*(.45+.3*k),3,t)}
else if(p.s===2){const k=1-p.t/p.d;ctx.strokeStyle='#ffd54a';ctx.lineWidth=4*u;ctx.shadowColor='#ffd54a';ctx.shadowBlur=14*u;ctx.beginPath();ctx.arc(cx,cy,c*.43,-1.57,-1.57+6.283*k);ctx.stroke();ctx.shadowBlur=0;plantIcon(ctx,cx,cy-c*.03,c*.8,9,t)}
else if(p.s===3){ctx.globalAlpha=.4;plantIcon(ctx,cx,cy-c*.03,c*.7,3,t);ctx.globalAlpha=1}
else if(p.s===4){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.8);ctx.fillStyle='#a05ae0';ctx.shadowColor='#a05ae0';ctx.shadowBlur=10*u;ctx.beginPath();for(let k=0;k<16;k++){const q=k%2?c*.14:c*.34,a=k*Math.PI/8;ctx.lineTo(Math.cos(a)*q,Math.sin(a)*q)}ctx.closePath();ctx.fill();ctx.restore()}}
partsDraw();if(hCo>=3){ctx.fillStyle='#ffd54a';ctx.font=`900 ${24*u}px Fraunces,serif`;ctx.textAlign='center';ctx.fillText('x'+hCo,W/2,y0-14*u)}
hint('h4',y0+c*4+32*u);ctx.restore()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setLang(lang);home();requestAnimationFrame(loop);
</script></body></html>
